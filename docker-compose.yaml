services:
  # ---- CONTENEDOR DE MONGO ----
  DocsFlowDatabase:
    image: mongo:7.0
    container_name: DocsFlowDatabase
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./DocsFlowDatabase:/data/db
    ports:
      - "27017:27017"

  # ---- MICROSERVICIO DE AUTENTICACIÓN ----
  Auth_Service:
    image: node:22
    container_name: Auth_Service
    working_dir: /app
    depends_on:
      - DocsFlowDatabase
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      MONGO_URI: ${MONGO_URI}
    volumes:
      - ./Auth_Service:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"

  # ---- TU MICROSERVICIO: USER SERVICE ----
  User_Service:
    image: node:22
    container_name: User_Service
    working_dir: /app
    depends_on:
      - DocsFlowDatabase
    environment:
      MONGO_URI: ${MONGO_URI}
      USER_PORT: 3002
    volumes:
      - ./User_Service:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3002:3002"